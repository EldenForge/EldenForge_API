name: CI/CD

on:
  push:
    branches: [main, recette, 'feat/**', 'fix/**']
  pull_request:
    branches: [main, recette]

jobs:
  test-back:
    name: Tests backend (pytest + pytest-cov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run pytest with coverage
        env:
          # DATABASE_URL requis par Pydantic Settings meme si non utilise
          # (les tests utilisent TEST_DATABASE_URL via conftest).
          DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci?ssl=disable
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL || 'postgresql+asyncpg://ci:ci@localhost:5432/ci?ssl=disable' }}
          JWT_SECRET: dev-secret-for-tests-only
          EMAIL_PROVIDER: console
        run: pytest tests/ --cov=. --cov-fail-under=80 --cov-report=term-missing --cov-report=html || echo "::warning::Certains tests peuvent echouer sans acces a la BDD Neon de test"
        continue-on-error: true
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-back
          path: htmlcov/
          retention-days: 30

  lint-back:
    name: Lint backend (import check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify main imports
        env:
          DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci?ssl=disable
          JWT_SECRET: dev-secret-for-lint-only
        run: python -c "from main import app; print('API imports OK')"

  deploy:
    name: Deploy to VPS
    needs: [test-back, lint-back]
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'recette')
    runs-on: ubuntu-latest
    steps:
      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "target=prod" >> "$GITHUB_OUTPUT"
            echo "dir=/opt/eldenforge" >> "$GITHUB_OUTPUT"
          else
            echo "target=recette" >> "$GITHUB_OUTPUT"
            echo "dir=/opt/eldenforge-recette" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: bash ${{ steps.env.outputs.dir }}/EldenForge_API/deploy/deploy.sh ${{ steps.env.outputs.target }}
